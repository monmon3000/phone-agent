name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build (no code signing)
        run: |
          xcodebuild -version
          xcodebuild -project PhoneAgent.xcodeproj -scheme PhoneAgent \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PhoneAgent-unsigned.ipa Payload
          ls -l PhoneAgent-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-unsigned-ipa
          path: PhoneAgent-unsigned.ipa
